# The one OMP preset for the laptop and the devbox: model roles, feature flags, `secrets` and the
# `bash.patterns` guardrail. Seeded when absent by container/bootstrap.sh (devbox), `devbox agent install`
# (laptop) and dotfiles' `dot setup` (laptop, before OMP first starts); OMP owns the live file afterwards.
# The installers never touch an existing file - both here report one that lacks the `bash:` block.
# Change this file, commit, then `devbox sync omp` applies it to the laptop and the devbox (a `.bak` kept on
# each). A setting changed in OMP on the laptop lands in ~/.omp/agent/config.yml only: copy that file over
# this one first (`make fmt`; `dot doctor` flags any difference), or the sync replaces it.
modelRoles:
  default: anthropic/claude-opus-5-5:medium
  advisor: anthropic/claude-fable-5-1:high
  task: anthropic/claude-sonnet-5-5:high
  plan: anthropic/claude-opus-5-5:high
  commit: anthropic/claude-haiku-5-5:medium
  smol: anthropic/claude-haiku-5-5:medium
  tiny: anthropic/claude-haiku-5-5:low
  vision: anthropic/claude-sonnet-5-5:medium
  slow: anthropic/claude-opus-5-5:xhigh
symbolPreset: unicode
theme:
  dark: titanium
setupVersion: 2
memory:
  backend: mnemopi
autolearn:
  enabled: false
  autoContinue: false
defaultThinkingLevel: auto
dev:
  autoqaConsent: granted
display:
  showTokenUsage: true
checkpoint:
  enabled: true
mnemopi:
  scoping: per-project-tagged
power:
  sleepPrevention: idle
features:
  unexpectedStopDetection: none
error:
  notify: 'on'
composer:
  shape: claude
extendedContext: false
statusLine:
  compactThinkingLevel: false
disabledProviders: []
# Reads ~/.claude/CLAUDE.md, which imports the machine's agent context (devbox or laptop) for Claude Code
# and OMP alike, task subagents included; also loads ~/.claude/skills and Claude's user plugins.
enabledProviders:
  - claude
advisor:
  enabled: true
  syncBacklog: '1'
  maxNotesPerUpdate: 4
  immuneTurns: 3
github:
  enabled: true
tier:
  advisor: none

# `secrets.enabled` obfuscates any API key found in the environment - from
# ~/.config/devbox/secrets.env or a project .env - before it can reach a provider.
secrets:
  enabled: true

# Guardrail, not containment (docs/security.md, accepted limit 7). `deny` holds
# even under yolo; `prompt` means a person decides. Three things it cannot do:
#
# - Survive a project's own `bash.patterns`. Arrays are replaced, not merged,
#   across settings layers, so a repository whose .omp/config.yml lists any
#   patterns drops every rule here - copy the ones it needs into that file.
# - Cover the `eval` tool, which can start a shell of its own.
# - Stop a determined process: patterns match command text (`*` is the only
#   wildcard), so a script file or an interpreter one-liner walks past them.
#
# What actually bounds an agent is what its credentials can do - on the devbox
# nothing broader than the scoped PATs and App keys exists. These rules catch
# the obvious reach past that: the human GitHub login, the keychain, the vault,
# cloud consoles, and history or data destruction.
bash:
  patterns:
    # The human GitHub login. The agent's `gh` is the shim's scoped token; these
    # read, replace or reconfigure the account-wide one. Plain `gh auth status`
    # is left to the session's mode - it shows which token a shell holds - and
    # the subcommands are enumerated rather than `gh auth *`, because a deny is
    # also tested against every segment and would kill `gh auth status | ...`.
    - match: 'gh auth status*--show-token*'
      approval: deny
    - match: 'gh auth status* -t*'
      approval: deny
    - match: 'gh auth token*'
      approval: deny
    - match: 'gh auth login*'
      approval: deny
    - match: 'gh auth logout*'
      approval: deny
    - match: 'gh auth refresh*'
      approval: deny
    - match: 'gh auth setup-git*'
      approval: deny
    - match: 'gh auth switch*'
      approval: deny
    # Stepping out of the launcher's fence - the exact shape of a past bypass,
    # `env -u GH_CONFIG_DIR -u GH_TOKEN /opt/homebrew/bin/gh pr create`, which
    # reached the human OAuth login. Every `gh` rule above is anchored on the
    # bare name, so an absolute path to the real gh skips both them and the
    # shim; clearing or reassigning the four exports undoes the fence for one
    # command. Reading them (`echo $GIT_CONFIG_GLOBAL`, the documented session
    # check) stays allowed: only unset, assignment and env-scrubbing match.
    # Tradeoff: this repo's own smoke tests use `env -i HOME=… PATH=…` and
    # `GIT_CONFIG_GLOBAL=… <cmd>` probes. `env -i` is therefore `prompt` - a
    # person approves it, and yolo still stops instead of failing silently -
    # while assigning an export stays `deny`: a probe can write a throwaway
    # HOME and let the launcher set the variable instead.
    - match: '*/bin/gh *'
      approval: deny
    - match: '*/bin/gh'
      approval: deny
    - match: '*env -u *'
      approval: deny
    - match: '*env --unset*'
      approval: deny
    - match: '*env -i *'
      approval: prompt
    - match: '*unset *GIT_CONFIG_GLOBAL*'
      approval: deny
    - match: '*unset *GIT_SSH_COMMAND*'
      approval: deny
    - match: '*unset *GH_CONFIG_DIR*'
      approval: deny
    - match: '*unset *GIT_TERMINAL_PROMPT*'
      approval: deny
    - match: '*GIT_CONFIG_GLOBAL=*'
      approval: deny
    - match: '*GIT_SSH_COMMAND=*'
      approval: deny
    - match: '*GH_CONFIG_DIR=*'
      approval: deny
    - match: '*GIT_TERMINAL_PROMPT=*'
      approval: deny
    # Credential stores outside the agent's own: the macOS keychain (where the
    # human gh login and git credentials live) and 1Password.
    - match: '*security find-generic-password*'
      approval: deny
    - match: '*security find-internet-password*'
      approval: deny
    - match: '*security dump-keychain*'
      approval: deny
    - match: '*git credential-osxkeychain*'
      approval: deny
    - match: 'op *'
      approval: prompt
    - match: 'op'
      approval: prompt
    # GitHub surfaces no agent session should touch.
    - match: 'gh repo delete*'
      approval: deny
    - match: 'gh secret *'
      approval: deny
    - match: 'gh variable *'
      approval: deny
    - match: 'gh api -X DELETE *'
      approval: deny
    - match: 'gh api --method DELETE *'
      approval: deny
    - match: 'gh workflow run *'
      approval: prompt
    # Cloud and infrastructure: a person decides.
    - match: 'gcloud *'
      approval: prompt
    - match: 'gcloud'
      approval: prompt
    - match: '*terraform apply*'
      approval: prompt
    - match: '*terraform import*'
      approval: prompt
    - match: '*terraform destroy*'
      approval: deny
    # Vercel and Neon: reads (list, inspect, logs, env ls, `api` GETs) stay with
    # the session's mode; anything that writes, deploys, spends, links, logs
    # in or hands out a secret prompts. Every rule starts with `*` and puts
    # `*` after the CLI name, so the global binary, `npx`/`pnpx`/`pnpm dlx`/
    # `bunx`, a pinned `vercel@<v>`, `neonctl` and global flags before the
    # subcommand all match; the cost is a prompt on any other command that
    # mentions the CLI before such a word (`git commit -m "vercel: add …"`,
    # and for `vc` any word containing it, `svc`). Write subcommands are
    # matched by verb, not enumerated per resource, so new resources sharing
    # a verb are covered; a new verb is not. A bare `npx vercel@<v>` still
    # deploys unprompted. Deny mirrors `gh repo delete` and `gh api -X
    # DELETE`: project deletion, raw API DELETEs and minting account tokens.
    - match: '*vercel* project delete*'
      approval: deny
    - match: '*vercel* project remove*'
      approval: deny
    - match: '*vercel* project rm*'
      approval: deny
    - match: '*vercel* projects delete*'
      approval: deny
    - match: '*vercel* projects remove*'
      approval: deny
    - match: '*vercel* projects rm*'
      approval: deny
    - match: '*vercel* tokens create*'
      approval: deny
    - match: '*vercel* api *-X DELETE*'
      approval: deny
    - match: '*vercel* api *-XDELETE*'
      approval: deny
    - match: '*vercel* api *--method DELETE*'
      approval: deny
    - match: '*vercel* api *--method=DELETE*'
      approval: deny
    - match: '*vc* project delete*'
      approval: deny
    - match: '*vc* project remove*'
      approval: deny
    - match: '*vc* project rm*'
      approval: deny
    - match: '*vc* projects delete*'
      approval: deny
    - match: '*vc* projects remove*'
      approval: deny
    - match: '*vc* projects rm*'
      approval: deny
    - match: '*vc* tokens create*'
      approval: deny
    - match: '*vc* api *-X DELETE*'
      approval: deny
    - match: '*vc* api *-XDELETE*'
      approval: deny
    - match: '*vc* api *--method DELETE*'
      approval: deny
    - match: '*vc* api *--method=DELETE*'
      approval: deny
    - match: '*neon* projects delete*'
      approval: deny
    - match: '*neon* project delete*'
      approval: deny
    - match: '*neon* api-keys create*'
      approval: deny
    - match: '*neon* api-key create*'
      approval: deny
    - match: '*neon* api *-X DELETE*'
      approval: deny
    - match: '*neon* api *-XDELETE*'
      approval: deny
    - match: '*neon* api *--method DELETE*'
      approval: deny
    - match: '*neon* api *--method=DELETE*'
      approval: deny
